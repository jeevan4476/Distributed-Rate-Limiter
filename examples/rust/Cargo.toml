[package]
name = "payment-processor"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axum = "0.8.8"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
prost-types = "0.14"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"


[build-dependencies]
tonic-prost-build = "0.14"