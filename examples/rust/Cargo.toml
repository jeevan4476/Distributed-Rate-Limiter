[package]
name = "payment-processor"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axum = "0.8.8"
prost = "0.14.3"
tokio = {version = "1.50.0" , features=["full"]}
tonic = "0.14.5"
prost-types = "0.14"
uuid = { version = "1.22.0", features = ["v4"] }
serde = {version = "1.0.228" , features = ["derive"]}
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"


[build-dependencies]
tonic-build = "0.14"