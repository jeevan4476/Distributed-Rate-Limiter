<svg viewBox="0 50 900 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#0f172a" rx="12"/>


  <!-- CLIENT -->
  <rect x="340" y="80" width="220" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="101" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">gRPC CLIENT</text>
  <text x="450" y="118" text-anchor="middle" fill="#64748b" font-size="10">AcquireRequest { requestId, logicalKey, cost }</text>

  <!-- Arrow client → handler -->
  <line x1="450" y1="132" x2="450" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TRANSPORT LAYER -->
  <rect x="290" y="160" width="320" height="52" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="181" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">TRANSPORT — grpc_handler.ts</text>
  <text x="450" y="198" text-anchor="middle" fill="#64748b" font-size="10">Validate inputs · Map proto ↔ domain types</text>

  <!-- Arrow handler → service -->
  <line x1="450" y1="212" x2="450" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SERVICE LAYER -->
  <rect x="270" y="240" width="360" height="62" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="261" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">SERVICE — acquire_service.ts</text>
  <text x="450" y="278" text-anchor="middle" fill="#64748b" font-size="10">Retry logic · Exponential backoff + jitter</text>
  <text x="450" y="293" text-anchor="middle" fill="#64748b" font-size="10">Calls repo.acquire() — backend agnostic</text>

  <!-- Arrow service → domain -->
  <line x1="450" y1="302" x2="450" y2="328" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DOMAIN LAYER -->
  <rect x="300" y="330" width="300" height="52" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="351" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">DOMAIN — token_bucket.ts</text>
  <text x="450" y="368" text-anchor="middle" fill="#64748b" font-size="10">Pure function · Zero I/O · Refill + consume logic</text>

  <!-- RateLimitRepository interface line -->
  <line x1="450" y1="382" x2="450" y2="408" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="456" y="400" fill="#475569" font-size="9">RateLimitRepository interface</text>

  <!-- Fork to two backends -->
  <line x1="450" y1="410" x2="220" y2="430" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="410" x2="680" y2="430" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- POSTGRES BACKEND -->
  <rect x="60" y="432" width="310" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="215" y="453" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">POSTGRES — pg_repository.ts</text>
  <text x="215" y="470" text-anchor="middle" fill="#64748b" font-size="10">SERIALIZABLE transaction</text>
  <text x="215" y="485" text-anchor="middle" fill="#64748b" font-size="10">Idempotency table · FOR UPDATE lock</text>
  <text x="215" y="500" text-anchor="middle" fill="#64748b" font-size="10">Retry on 40001 / 40P01 conflicts</text>

  <!-- Postgres DB -->
  <rect x="100" y="548" width="230" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="215" y="568" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">PostgreSQL</text>
  <text x="215" y="583" text-anchor="middle" fill="#64748b" font-size="9">rate_limit_buckets · idempotency_keys</text>
  <line x1="215" y1="522" x2="215" y2="548" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- REDIS BACKEND -->
  <rect x="530" y="432" width="310" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="685" y="453" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">REDIS — redis_repository.ts</text>
  <text x="685" y="470" text-anchor="middle" fill="#64748b" font-size="10">Lua script (atomic, single-threaded)</text>
  <text x="685" y="485" text-anchor="middle" fill="#64748b" font-size="10">Idempotency via key TTL</text>
  <text x="685" y="500" text-anchor="middle" fill="#64748b" font-size="10">No retries needed — Lua guarantees atomicity</text>

  <!-- Redis DB -->
  <rect x="570" y="548" width="230" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="685" y="568" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">Redis</text>
  <text x="685" y="583" text-anchor="middle" fill="#64748b" font-size="9">bucket:{key} hash · idempotency:{requestId}</text>
  <line x1="685" y1="522" x2="685" y2="548" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- BENCHMARK BOX -->
  <rect x="230" y="548" width="440" height="0" rx="8" fill="none"/>

  <!-- Benchmark comparison strip -->
  <rect x="185" y="604" width="530" height="0" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Legend -->
  <rect x="60" y="604" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="78" y="615" fill="#94a3b8" font-size="10">PostgreSQL: 3,529 RPS · P99 31ms</text>
  <rect x="300" y="604" width="12" height="12" rx="2" fill="#ef4444"/>
  <text x="318" y="615" fill="#94a3b8" font-size="10">Redis: 18,510 RPS · P99 2.87ms → 5.2x faster</text>

  <!-- BACKEND env var label -->
  <rect x="690" y="80" width="170" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="97" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Switch via env var</text>
  <text x="775" y="113" text-anchor="middle" fill="#fcd34d" font-size="10">BACKEND=postgres|redis</text>
</svg>