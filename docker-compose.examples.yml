# Docker Compose for running all example services
# Usage: docker compose -f docker-compose.yml -f docker-compose.examples.yml up --build

services:
  rate-limiter:
    build: .
    container_name: rate-limiter
    ports:
      - "50051:50051"
    environment:
      BACKEND: ${BACKEND:-postgres}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ratelimiter
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  search-api:
    build:
      context: .
      dockerfile: examples/typescript/Dockerfile
    container_name: search-api
    ports:
      - "3000:3000"
    environment:
      RATE_LIMITER_ADDR: rate-limiter:50051
    depends_on:
      rate-limiter:
        condition: service_healthy

  payment-processor:
    build:
      context: .
      dockerfile: examples/rust/Dockerfile
    container_name: payment-processor
    ports:
      - "8000:8000"
    environment:
      RATE_LIMITER_ADDR: http://rate-limiter:50051
      BIND_ADDR: 0.0.0.0:8000
    depends_on:
      rate-limiter:
        condition: service_healthy
